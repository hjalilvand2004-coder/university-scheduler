name: Build Portable (Windows)

# ساخت نسخه قابل حمل برای ویندوز و انتشار در بخش Releases
# روش استفاده:
#   1) روی برچسب جدید push بدهید:  git tag v2.1.0 && git push origin v2.1.0
#   2) یا از تب Actions به‌صورت دستی (workflow_dispatch) اجرا کنید
# خروجی: فایل zip قابل اجرا روی هر لپ‌تاپ ویندوزی بدون نیاز به Python/Node

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend (React + Vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy frontend dist into backend
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force backend/frontend_dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse frontend/dist backend/frontend_dist
          Get-ChildItem backend/frontend_dist | Select-Object Name

      - name: Build portable executable (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller ..\portable\scheduler_server.spec --noconfirm --clean

      - name: Smoke test the portable build
        shell: pwsh
        run: |
          $exe = "backend\dist\UniversityScheduler\UniversityScheduler.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if ($ok) { Write-Host "Portable build smoke test PASSED" }
          else { Write-Host "Warning: health check did not answer (may be port conflict)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $readme = @"
          ==========================================================
           سامانه هوشمند برنامه‌ریزی درسی — نسخه قابل حمل
           Intelligent University Scheduler - Portable Edition
          ==========================================================

          روش اجرا:
            1) فایل UniversityScheduler.exe را اجرا کنید.
            2) چند لحظه صبر کنید تا مرورگر به‌صورت خودکار باز شود.
               (اگر باز نشد، آدرس http://127.0.0.1:8000 را باز کنید)
            3) برای خروج، پنجره سیاه (کنسول) را ببندید.

          نکات مهم:
            - نیازی به نصب Python، PyCharm، Node.js یا هر پیش‌نیاز دیگری نیست.
            - دیتابیس در پوشه data کنار فایل exe ذخیره می‌شود؛
              برای انتقال برنامه به رایانه دیگر، کل این پوشه را کپی کنید.
            - اگر پورت 8000 اشغال باشد، برنامه به‌صورت خودکار پورت بعدی را
              استفاده می‌کند (آدرس را در پنجره کنسول ببینید).
            - این نسخه کاملاً آفلاین کار می‌کند (اینترنت لازم نیست).

          رفع اشکال:
            - اگر صفحه باز نشد: چند ثانیه صبر کنید و صفحه را رفرش کنید.
            - اگر آنتی‌ویروس هشدار داد: این پوشه را در فهرست امن (Exclusion)
              قرار دهید؛ هشدار مربوط به فایل‌های اجرایی نشده با امضای دیجیتال است.
          "@
          Set-Content -Path "backend\dist\UniversityScheduler\README-PORTABLE.txt" -Value $readme -Encoding UTF8
          Compress-Archive -Path "backend\dist\UniversityScheduler" -DestinationPath "backend\dist\UniversityScheduler-Portable-win64.zip" -Force
          Get-Item "backend\dist\UniversityScheduler-Portable-win64.zip" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversityScheduler-Portable-win64
          path: backend/dist/UniversityScheduler-Portable-win64.zip
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/UniversityScheduler-Portable-win64.zip
          generate_release_notes: true
          body: |
            ## نسخه قابل حمل سامانه هوشمند برنامه‌ریزی درسی 🎓

            ### 📦 نصب و اجرا (بدون هیچ پیش‌نیازی!)
            1. فایل زیپ را دانلود و استخراج کنید
            2. `UniversityScheduler.exe` را اجرا کنید
            3. مرورگر به‌صورت خودکار روی `http://127.0.0.1:8000` باز می‌شود

            ✅ بدون نیاز به Python | ✅ بدون نیاز به Node.js | ✅ کاملاً آفلاین
            💾 دیتابیس در پوشه `data` کنار برنامه ذخیره می‌شود (قابل حمل روی فلش USB)
